<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apex Arena 3D - Multi Weapons</title>
<link rel="preconnect" href="[https://fonts.googleapis.com](https://fonts.googleapis.com)">
<link href="[https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Noto+Sans+JP:wght@500;700&display=swap](https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Noto+Sans+JP:wght@500;700&display=swap)" rel="stylesheet">
<style>
  :root { --bg: #10131a; --panel: #1a2030; --red: #ff4d3d; --steel: #8fa3b8; --ice: #e8f1f8; --sh: #4cc3ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ice); font-family: "Rajdhani", "Noto Sans JP", system-ui, sans-serif; overflow: hidden; font-size: 18px; }
  canvas { display: block; }
  .ov { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: rgba(12, 15, 22, 0.92); z-index: 10; text-align: center; padding: 20px; }
  .hide { display: none !important; }
  h1 { font-size: clamp(40px, 8vw, 84px); margin: 0; font-weight: 700; line-height: 1; letter-spacing: -1px; transform: skewX(-8deg); }
  h1 b { color: var(--red); }
  p { margin: 0; color: var(--steel); }
  button { font: inherit; font-weight: 700; background: var(--red); color: #fff; border: 0; padding: 12px 30px; cursor: pointer; clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%); }
  button:hover, button:focus-visible { background: #ff7060; outline: none; }
  button.alt { background: var(--panel); color: var(--ice); }
  button.sel { background: var(--ice); color: var(--bg); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center; }
  .card { background: var(--panel); padding: 14px 20px; min-width: 260px; border-left: 4px solid var(--red); text-align: left; }
  .card ol { margin: 6px 0 0; padding-left: 22px; color: var(--steel); }
  #user { display: flex; align-items: center; gap: 10px; }
  #user img { width: 40px; height: 40px; border-radius: 50%; background: var(--steel); }
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  #cross { position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px; border: 2px solid #fff; border-radius: 50%; opacity: 0.8; }
  #cross.hit { border-color: var(--red); transform: scale(1.5); }
  #scope { position: absolute; inset: 0; opacity: 0; background: radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.85) 100%); }
  #sniper-cross { position: absolute; left: 50%; top: 50%; width: 100vw; height: 1px; background: rgba(0,0,0,0.6); margin-left: -50vw; opacity: 0; }
  #sniper-cross::after { content: ''; position: absolute; left: 50%; top: -50vh; width: 1px; height: 100vh; background: rgba(0,0,0,0.6); }
  #dot { position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: #ff2a2a; box-shadow: 0 0 6px 2px rgba(255, 40, 40, 0.8); opacity: 0; }
  #bars { position: absolute; left: 24px; bottom: 24px; width: 280px; }
  .bar { height: 12px; background: rgba(0,0,0,0.5); margin-top: 6px; transform: skewX(-20deg); }
  .bar i { display: block; height: 100%; width: 100%; transition: width 0.2s; }
  #hp i { background: #5be37d; } #sh i { background: var(--sh); }
  #ammo { position: absolute; right: 28px; bottom: 24px; font-size: 56px; font-weight: 700; text-align: right; line-height: 1; }
  #ammo small { display: block; font-size: 18px; color: var(--steel); font-weight: 500; }
  #wepName { font-size: 24px; color: var(--ice); display: block; margin-bottom: -10px; }
  #top { position: absolute; top: 18px; left: 0; right: 0; text-align: center; font-size: 24px; font-weight: 700; }
  #abil { position: absolute; left: 24px; bottom: 96px; font-size: 18px; color: var(--steel); }
  #wepList { position: absolute; right: 28px; bottom: 120px; text-align: right; font-size: 16px; color: var(--steel); opacity: 0.7; }
  #banner { position: absolute; top: 22%; left: 0; right: 0; text-align: center; font-size: 44px; font-weight: 700; opacity: 0; transition: opacity 0.4s; }
  #flash { position: absolute; inset: 0; box-shadow: inset 0 0 160px rgba(255, 40, 30, 0.9); opacity: 0; transition: opacity 0.25s; }
  @media (prefers-reduced-motion: reduce) { #banner, #flash, #cross { transition: none; } }
</style>
</head>
<body>

<div id="login" class="ov">
  <h1>APEX <b>ARENA</b></h1>
  <p>マルチウェポン・アップデート</p>
  <button id="btnLogin">ゲームを始める</button>
</div>

<div id="menu" class="ov hide">
  <p>レジェンドを選択</p>
  <div class="row" id="legends"></div>
  <p id="legDesc"></p>
  <div class="row">
    <button id="btnStart">出撃</button>
  </div>
  <div class="card">
    <b>遊び方</b>
    <ol style="list-style: none; padding: 0;">
      <li>1, 2, 3: 武器切り替え (AR / SMG / SR)</li>
      <li>WASD: 移動 / Shift: スライディング / Space: ジャンプ</li>
      <li>右クリック: エイム(ADS) / R: リロード / Q: アビリティ</li>
      <li>壁に前進 → ジャンプ: ウォールバウンス</li>
    </ol>
  </div>
</div>

<div id="pause" class="ov hide">
  <h1>PAUSE</h1>
  <p>クリックして再開</p>
</div>

<div id="over" class="ov hide">
  <h1>DOWNED</h1>
  <p id="result"></p>
  <button id="btnBack">メニューへ戻る</button>
</div>

<div id="hud" class="hide">
  <div id="top"><span id="wave"></span> ・ <span id="kills"></span></div>
  <div id="scope"></div>
  <div id="sniper-cross"></div>
  <div id="dot"></div>
  <div id="cross"></div>
  <div id="banner"></div>
  <div id="abil"></div>
  <div id="wepList">1: AR<br>2: SMG<br>3: Sniper</div>
  <div id="bars">
    <div class="bar" id="sh"><i></i></div>
    <div class="bar" id="hp"><i></i></div>
  </div>
  <div id="ammo">
    <span id="wepName">アサルトライフル</span>
    <span id="am">30</span><small id="reload"></small>
  </div>
  <div id="flash"></div>
</div>

<script type="module">
import * as THREE from '[https://unpkg.com/three@0.160.0/build/three.module.js](https://unpkg.com/three@0.160.0/build/three.module.js)';

const $ = id => document.getElementById(id);
const show = (id, v) => $(id).classList.toggle('hide', !v);

$('btnLogin').onclick = () => { show('login', 0); show('menu', 1); };$('btnBack').onclick = () => { show('over', 0); show('menu', 1); };

const LEG = {
  wraith: { n: 'レイス', d: 'Q: 前方へ瞬間ダッシュ(CT 6秒)', cd: 6 },
  octane: { n: 'オクタン', d: 'Q: 4秒間 移動速度1.5倍(CT 10秒)', cd: 10 }
};
let pick = 'wraith';
function drawLegends() {
  const box = $('legends'); box.innerHTML = '';
  for (const k in LEG) {
    const b = document.createElement('button');
    b.textContent = LEG[k].n; b.className = (k === pick) ? 'sel' : 'alt';
    b.onclick = () => { pick = k; drawLegends(); };
    box.appendChild(b);
  }
  $('legDesc').textContent = LEG[pick].d;
}
drawLegends();

/* ---------- 武器データ定義 ---------- */
const WEP = [
  { n: 'アサルトライフル', mag: 30, fr: 0.1,  kick: 0.04, dmg: 18, hdmg: 36,  fov: 45, spd: 1.0, rld: 1.6 },
  { n: 'サブマシンガン',   mag: 40, fr: 0.05, kick: 0.03, dmg: 11, hdmg: 22,  fov: 60, spd: 1.1, rld: 1.2 },
  { n: 'スナイパー',       mag: 5,  fr: 1.2,  kick: 0.25, dmg: 75, hdmg: 150, fov: 15, spd: 0.9, rld: 2.5 }
];

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x75a3cd);
scene.fog = new THREE.FogExp2(0x75a3cd, 0.015);

const cam = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 200);
cam.rotation.order = 'YXZ';
scene.add(cam);

const ren = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
ren.setSize(innerWidth, innerHeight);
ren.setPixelRatio(Math.min(devicePixelRatio, 2));
ren.shadowMap.enabled = true;
ren.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(ren.domElement);

window.addEventListener('resize', () => {
  cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix();
  ren.setSize(innerWidth, innerHeight);
});

scene.add(new THREE.HemisphereLight(0xffffff, 0x44505e, 0.8));
const sun = new THREE.DirectionalLight(0xffefdf, 1.5);
sun.position.set(40, 70, 30);
sun.castShadow = true;
sun.shadow.camera.left = -60; sun.shadow.camera.right = 60;
sun.shadow.camera.top = 60; sun.shadow.camera.bottom = -60;
sun.shadow.mapSize.width = 2048; sun.shadow.mapSize.height = 2048;
scene.add(sun);

const floor = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), new THREE.MeshStandardMaterial({ color: 0x3a463c, roughness: 0.8 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
scene.add(new THREE.GridHelper(120, 60, 0x55665a, 0x4a5a4e));

const boxes = [];
const wallMats = [0x5a6370, 0x7a634b, 0x3b4c6a].map(c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.7 }));
function addBox(x, z, w, h, d) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMats[boxes.length % 3]);
  m.position.set(x, h / 2, z); m.castShadow = true; m.receiveShadow = true;
  scene.add(m); m.updateMatrixWorld();
  boxes.push({ m, b: new THREE.Box3().setFromObject(m) });
}

let seed = 12; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
for (let i = 0; i < 44; i++) {
  const x = (rnd() - 0.5) * 100, z = (rnd() - 0.5) * 100;
  if (Math.hypot(x, z) < 9) continue;
  addBox(x, z, 2 + rnd() * 6, 1 + rnd() * 4, 2 + rnd() * 6);
}
addBox(0, -60, 120, 12, 2); addBox(0, 60, 120, 12, 2); addBox(-60, 0, 2, 12, 120); addBox(60, 0, 2, 12, 120);

const gun = new THREE.Group();
const MT = (c, m=0.6, r=0.45) => new THREE.MeshStandardMaterial({ color: c, metalness: m, roughness: r });
const dark = MT(0x1f2329), poly = MT(0x15171b, 0.2, 0.8), glove = MT(0x1a1a1a, 0.1, 0.9);
const B = (w, h, d) => new THREE.BoxGeometry(w, h, d);
const part = (geo, mat, x, y, z, rx=0) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.rotation.x = rx; gun.add(m); return m; };

part(B(0.06, 0.09, 0.34), dark, 0, 0, 0); 
part(B(0.04, 0.14, 0.07), poly, 0, -0.11, -0.04, 0.12);
part(B(0.035, 0.09, 0.045), poly, 0, -0.085, 0.1, -0.3);
const rHand = part(B(0.045, 0.05, 0.06), glove, 0.02, -0.06, -0.03); 
const lHand = part(B(0.04, 0.045, 0.06), glove, -0.04, -0.01, -0.27); 

const flash = part(new THREE.SphereGeometry(0.04, 8, 6), new THREE.MeshBasicMaterial({ color: 0xffcc44 }), 0, 0.02, -0.5); flash.visible = false;
const muzzleLight = new THREE.PointLight(0xffaa00, 0, 15); muzzleLight.position.set(0.22, 0, -1); cam.add(muzzleLight);

gun.position.set(0.22, -0.2, -0.5); cam.add(gun);

const cv = document.createElement('canvas'); cv.width = 128; cv.height = 128; const ctx = cv.getContext('2d');
ctx.fillStyle = '#1a1a1a'; ctx.fillRect(0,0,128,128); ctx.fillStyle = '#ff3333'; ctx.fillRect(0,0,64,64); ctx.fillRect(64,64,64,64);
const eTex = new THREE.CanvasTexture(cv); eTex.magFilter = THREE.NearestFilter;
const eMatBody = new THREE.MeshStandardMaterial({ map: eTex, roughness: 0.5 }); 
const eMatHead = new THREE.MeshStandardMaterial({ color: 0xf0c8a0, roughness: 0.6 });

function collide(p, r, feet) {
  let g = 0; P.hitWall = false;
  for (const { b } of boxes) {
    if (p.x > b.min.x - r && p.x < b.max.x + r && p.z > b.min.z - r && p.z < b.max.z + r) {
      if (b.max.y <= feet + 0.6) g = Math.max(g, b.max.y);
      else if (feet < b.max.y) {
        P.hitWall = true;
        const a = b.max.x + r - p.x, c = p.x - (b.min.x - r), d = b.max.z + r - p.z, e = p.z - (b.min.z - r), m = Math.min(a, c, d, e);
        if (m === a) p.x = b.max.x + r; else if (m === c) p.x = b.min.x - r; else if (m === d) p.z = b.max.z + r; else p.z = b.min.z - r;
      }
    }
  } return g;
}

const G = { running: false, over: false, legend: 'wraith' };
const P = { pos: new THREE.Vector3(), vy: 0, ground: true, yaw: 0, pitch: 0, hp: 100, sh: 50, wIdx: 0, ammo: [30, 40, 5], reload: 0, fireT: 0, cd: 0, dash: 0, boost: 0, kills: 0, wave: 0, kick: 0, eye: 1.7, adsT: 0, slide: 0, sdx: 0, sdz: -1, lx: 0, lz: -1, flashT: 0, hitWall: false, bobT: 0 };
let enemies = [], eBullets = [], tracers = [], keys = {};
let fire = false, adsHeld = false, locked = false, waveWait = 0;
const rc = new THREE.Raycaster();

function spawnEnemy() {
  const g = new THREE.Group();
  const e = { g, hp: 100, cd: 1, side: Math.random() < 0.5 ? 1 : -1, meshes: [], state: 0, stateT: 0, vy: 0 };
  const parts = [[B(0.8, 1, 0.5), eMatBody, 0.95, 0], [B(0.7, 0.6, 0.4), new THREE.MeshStandardMaterial({color:0x111111}), 0.3, 0], [new THREE.SphereGeometry(0.26, 10, 8), eMatHead, 1.7, 1]];
  for (const [geo, mat, y, head] of parts) {
    const m = new THREE.Mesh(geo, mat); m.position.y = y; m.castShadow = true; m.userData = { enemy: e, head: !!head, baseY: y };
    g.add(m); e.meshes.push(m);
  }
  const a = Math.random() * Math.PI * 2, r = 34 + Math.random() * 8;
  g.position.set(Math.cos(a) * r, 0, Math.sin(a) * r);
  scene.add(g); enemies.push(e);
}

function nextWave() { P.wave++; P.sh = Math.min(50, P.sh + 30); P.hp = Math.min(100, P.hp + 20); for (let i = 0; i < 2 + P.wave; i++) spawnEnemy(); banner(`ウェーブ ${P.wave}`); }
function banner(t) { const b = $('banner'); b.textContent = t; b.style.opacity = 1; setTimeout(() => b.style.opacity = 0, 1600); }

$('btnStart').onclick = () => {
  G.legend = pick; G.running = true; G.over = false;
  Object.assign(P, { vy: 0, ground: true, yaw: 0, pitch: 0, hp: 100, sh: 50, wIdx: 0, ammo: [WEP[0].mag, WEP[1].mag, WEP[2].mag], reload: 0, fireT: 0, cd: 0, dash: 0, boost: 0, kills: 0, wave: 0, kick: 0, eye: 1.7, adsT: 0, slide: 0 });
  P.pos.set(0, 0, 0); enemies.forEach(e => scene.remove(e.g)); enemies = [];
  eBullets.forEach(b => scene.remove(b.m)); eBullets = []; adsHeld = fire = false;
  show('menu', 0); show('over', 0); show('hud', 1); show('pause', 0); nextWave(); ren.domElement.requestPointerLock();
};

document.addEventListener('pointerlockchange', () => { locked = document.pointerLockElement === ren.domElement; if (G.running && !G.over) show('pause', !locked); });
window.addEventListener('mousemove', e => { if (!locked) return; const k = 0.0022 * (1 - 0.7 * P.adsT); P.yaw -= e.movementX * k; P.pitch = Math.max(-1.45, Math.min(1.45, P.pitch - e.movementY * k)); });
window.addEventListener('mousedown', e => { if (e.button === 0) fire = true; if (e.button === 2) adsHeld = true; });
window.addEventListener('mouseup', e => { if (e.button === 0) fire = false; if (e.button === 2) adsHeld = false; });
window.addEventListener('contextmenu', e => { if (G.running) e.preventDefault(); });

window.addEventListener('keydown', e => {
  keys[e.code] = 1; if (e.code.startsWith('Shift')) keys.Shift = 1;
  if (!locked) return;
  if (e.code === 'Digit1') switchWep(0);
  if (e.code === 'Digit2') switchWep(1);
  if (e.code === 'Digit3') switchWep(2);
  if (e.code === 'KeyR') reload(); if (e.code === 'KeyQ') if (P.cd <= 0) { P.cd = LEG[G.legend].cd; if (G.legend === 'wraith') P.dash = 0.25; else P.boost = 4; }
  if (e.code.startsWith('Shift') && !e.repeat && P.ground && P.slide <= 0 && (keys.KeyW || keys.KeyA || keys.KeyS || keys.KeyD)) { P.slide = 1.0; P.sdx = P.lx; P.sdz = P.lz; }
  if (e.code === 'Space') { e.preventDefault(); if (P.ground || P.slide > 0) { P.vy = 8.5; P.ground = false; } }
});
window.addEventListener('keyup', e => { keys[e.code] = 0; if (e.code.startsWith('Shift')) keys.Shift = 0; });

function switchWep(i) {
  if (P.wIdx === i) return;
  P.wIdx = i; P.reload = 0; P.fireT = 0.4;
  $('wepName').textContent = WEP[i].n;
}

function reload() { if (!P.reload && P.ammo[P.wIdx] < WEP[P.wIdx].mag) P.reload = WEP[P.wIdx].rld; }

const dir = new THREE.Vector3(), org = new THREE.Vector3();
function shoot() {
  const w = WEP[P.wIdx];
  P.ammo[P.wIdx]--; P.fireT = w.fr; 
  P.kick = w.kick; P.pitch += w.kick * 0.4; 
  flash.visible = true; P.flashT = 0.04; muzzleLight.intensity = 5;
  
  cam.getWorldDirection(dir);
  const sg = 0.025 * (1 - 0.9 * P.adsT);
  dir.x += (Math.random() - 0.5) * sg; dir.y += (Math.random() - 0.5) * sg; dir.z += (Math.random() - 0.5) * sg; dir.normalize();
  cam.getWorldPosition(org); rc.set(org, dir); rc.far = 150;
  
  const hits = rc.intersectObjects([...boxes.map(o => o.m), ...enemies.flatMap(e => e.meshes)], false);
  const from = gun.localToWorld(new THREE.Vector3(0, 0.02, -0.5));
  let end = org.clone().addScaledVector(dir, 120);
  
  if (hits.length) {
    const h = hits[0]; end = h.point; const e = h.object.userData.enemy;
    if (e) {
      e.hp -= h.object.userData.head ? w.hdmg : w.dmg;
      const c = $('cross'); c.classList.add('hit'); setTimeout(() => c.classList.remove('hit'), 90);
      if (e.hp <= 0) { scene.remove(e.g); enemies = enemies.filter(x => x !== e); P.kills++; }
    }
  } 
  scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([from, end]), new THREE.LineBasicMaterial({ color: 0xffe27a, transparent: true, opacity: 0.6 })));
  tracers.push({ l: scene.children[scene.children.length - 1], t: 0.04 });
}

function update(dt) {
  const w = WEP[P.wIdx];
  const f = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0), r = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);
  const sy = Math.sin(P.yaw), cy = Math.cos(P.yaw);
  let mx = -sy * f + cy * r, mz = -cy * f - sy * r;
  const l = Math.hypot(mx, mz); if (l > 1) { mx /= l; mz /= l; } if (mx || mz) { P.lx = mx; P.lz = mz; }
  
  const crouch = keys.Shift && P.slide <= 0 && P.ground;
  let sp = (crouch ? 3.5 : 9) * (P.boost > 0 ? 1.5 : 1) * (adsHeld ? 0.65 : 1) * w.spd;
  
  if (P.slide > 0) { P.slide -= dt; if (!keys.Shift && P.ground) P.slide = 0; mx = P.sdx; mz = P.sdz; sp = 7 + 10 * Math.max(0, P.slide); }
  
  P.pos.x += mx * sp * dt; P.pos.z += mz * sp * dt;
  if (P.dash > 0) { P.dash -= dt; P.pos.x += -sy * 26 * dt; P.pos.z += -cy * 26 * dt; }
  P.pos.x = Math.max(-58, Math.min(58, P.pos.x)); P.pos.z = Math.max(-58, Math.min(58, P.pos.z));
  P.vy -= 22 * dt; P.pos.y += P.vy * dt;
  const g = collide(P.pos, 0.4, P.pos.y);
  if (P.pos.y <= g) { P.pos.y = g; P.vy = 0; P.ground = true; } else { P.ground = false; }
  
  const speed = Math.hypot(mx*sp, mz*sp); if (P.ground && speed > 0.1) P.bobT += dt * speed * 1.8;
  const bobY = Math.abs(Math.sin(P.bobT)) * 0.06 * (1 - P.adsT);
  const bobX = Math.cos(P.bobT) * 0.04 * (1 - P.adsT);

  P.cd = Math.max(0, P.cd - dt); P.boost = Math.max(0, P.boost - dt);
  P.fireT -= dt; P.kick = Math.max(0, P.kick - dt * (w.kick * 10));
  muzzleLight.intensity = Math.max(0, muzzleLight.intensity - dt * 50);

  let relY = 0, relRotX = 0, relRotZ = 0;
  if (P.reload > 0) { 
    P.reload -= dt; const t = w.rld - P.reload; 
    relY = Math.sin(t * Math.PI / w.rld) * -0.2; relRotX = Math.sin(t * Math.PI / w.rld) * 0.5; relRotZ = Math.sin(t * Math.PI / w.rld) * 0.2;
    lHand.position.set(-0.04, -0.01 - Math.sin(t * Math.PI) * 0.15, -0.27 + Math.sin(t * Math.PI) * 0.15);
    if (P.reload <= 0) { P.reload = 0; P.ammo[P.wIdx] = w.mag; } 
  } else { lHand.position.set(-0.04, -0.01, -0.27); }

  if (fire && P.fireT <= 0 && !P.reload) { if (P.ammo[P.wIdx] > 0) shoot(); else reload(); }
  
  const eye = new THREE.Vector3(P.pos.x, P.pos.y + P.eye - 0.1, P.pos.z);
  for (const e of enemies) {
    e.stateT -= dt; if (e.stateT <= 0) { e.stateT = 1 + Math.random() * 2; e.state = Math.floor(Math.random() * 3); e.side = (Math.random() < 0.5 ? 1 : -1) * (1 + Math.random()); if(e.state === 2 && e.g.position.y - collide(e.g.position, 0.45, e.g.position.y) < 0.1) e.vy = 7; }
    const p = e.g.position; const dx = P.pos.x - p.x, dz = P.pos.z - p.z, d = Math.hypot(dx, dz) || 1;
    let espd = Math.min(5, 3 + P.wave * 0.2);
    if (e.state === 1) { espd *= 1.8; e.meshes.forEach(m => m.position.y = m.userData.baseY * 0.5); } else e.meshes.forEach(m => m.position.y = m.userData.baseY);
    let vx = 0, vz = 0; if (d > 14) { vx = dx / d; vz = dz / d; } else if (d < 7) { vx = -dx / d; vz = -dz / d; }
    vx += -dz / d * 0.6 * e.side; vz += dx / d * 0.6 * e.side;
    p.x += vx * espd * dt; p.z += vz * espd * dt; p.x = Math.max(-58, Math.min(58, p.x)); p.z = Math.max(-58, Math.min(58, p.z));
    e.vy -= 22 * dt; p.y += e.vy * dt; const eg = collide(p, 0.45, p.y); if(p.y <= eg) { p.y = eg; e.vy = 0; }
    e.g.rotation.y = Math.atan2(dx, dz); e.cd -= dt;
    
    if (e.cd <= 0 && d < 45) {
      e.cd = 1.1 + Math.random() * 0.8;
      const bMesh = new THREE.Mesh(new THREE.SphereGeometry(0.18, 8, 8), new THREE.MeshBasicMaterial({ color: 0xff4400 }));
      bMesh.position.copy(new THREE.Vector3(p.x, p.y + (e.state===1 ? 0.75 : 1.5), p.z)); scene.add(bMesh);
      eBullets.push({ m: bMesh, v: eye.clone().sub(bMesh.position).normalize(), t: 2.5 });
    }
  }

  eBullets = eBullets.filter(b => {
    b.m.position.addScaledVector(b.v, 28 * dt); b.t -= dt;
    if (b.m.position.distanceTo(eye) < 0.9) {
      const dmg = Math.min(10, 5 + P.wave * 0.5);
      const a = Math.min(P.sh, dmg); P.sh -= a; P.hp -= (dmg - a);
      $('flash').style.opacity = 1; setTimeout(() =>$('flash').style.opacity = 0, 120);
      if (P.hp <= 0) { G.over = true; G.running = false; cam.fov = 75; cam.updateProjectionMatrix(); document.exitPointerLock(); show('hud', 0); show('over', 1); $('result').textContent = `ウェーブ ${P.wave} / キル ${P.kills}`; }
      scene.remove(b.m); return false;
    }
    const gy = collide(b.m.position, 0.1, b.m.position.y);
    if (b.m.position.y <= gy + 0.1 && gy > 0 || b.t <= 0) { scene.remove(b.m); return false; } return true;
  });
  
  if (!enemies.length && !G.over) { waveWait += dt; if (waveWait > 2.5) { waveWait = 0; nextWave(); } }
  
  P.eye += ((P.slide > 0 ? 0.8 : crouch ? 1.1 : 1.7) - P.eye) * Math.min(1, dt * 14);
  cam.position.set(P.pos.x, P.pos.y + P.eye + bobY, P.pos.z); cam.rotation.set(P.pitch, P.yaw, 0);
  
  P.adsT += ((adsHeld ? 1 : 0) - P.adsT) * Math.min(1, dt * 12);
  cam.fov = 75 - (75 - w.fov) * P.adsT; cam.updateProjectionMatrix();
  
  const L = (a, b) => a + (b - a) * P.adsT;
  gun.position.set(L(0.22, 0) + bobX, L(-0.2, -0.0945) + bobY + relY, L(-0.5, -0.34) + P.kick * 1.5);
  gun.rotation.set(P.kick * 2 + relRotX, 0, relRotZ);
  
  if (P.flashT > 0) { P.flashT -= dt; if (P.flashT <= 0) flash.visible = false; }
  $('dot').style.opacity = (P.wIdx !== 2 && P.adsT > 0.85) ? 1 : 0;
  $('scope').style.opacity = P.adsT;
  $('cross').style.visibility = P.adsT > 0.05 ? 'hidden' : 'visible';$('sniper-cross').style.opacity = (P.wIdx === 2 && P.adsT > 0.85) ? 1 : 0;
  
  $('hp').firstChild.style.width = Math.max(0, P.hp) + '\%';$('sh').firstChild.style.width = P.sh * 2 + '%';
  $('am').textContent = P.ammo[P.wIdx];$('reload').textContent = P.reload ? 'リロード中…' : `${w.mag}発マガジン`;
  $('wave').textContent = `ウェーブ ${P.wave}`; $('kills').textContent = `キル ${P.kills}`;
}

let last = performance.now();
function loop(t) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  if (G.running && locked) update(dt);
  for (const x of tracers) x.t -= dt;
  tracers = tracers.filter(x => { if (x.t <= 0) { scene.remove(x.l); return false; } return true; });
  ren.render(scene, cam);
}

cam.position.set(0, 30, 60); cam.lookAt(0, 0, 0); requestAnimationFrame(loop);
</script>
