<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D FPS Prototype</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Inter', sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        /* Crosshair */
        #crosshair {
            position: absolute;
            top: 50%; left: 50%;
            width: 4px; height: 4px;
            background-color: white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            display: none;
        }
        
        /* HUD */
        #hud {
            position: absolute;
            bottom: 20px; right: 20px;
            color: white; font-size: 24px;
            text-shadow: 1px 1px 2px black;
            display: none;
        }

        #health-bar {
            position: absolute;
            bottom: 20px; left: 20px;
            width: 200px; height: 20px;
            background-color: rgba(0,0,0,0.5);
            border: 2px solid white;
            display: none;
        }
        #health-fill {
            width: 100%; height: 100%;
            background-color: #4ade80;
        }

        /* Login Screen */
        #login-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(15, 23, 42, 0.9);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            pointer-events: auto;
            z-index: 100;
        }

        /* Instructions */
        #instructions {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: none; flex-direction: column;
            justify-content: center; align-items: center;
            color: white; pointer-events: auto; z-index: 50;
        }

        .dot-sight {
            position: absolute;
            top: 50%; left: 50%;
            width: 6px; height: 6px;
            background-color: red;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            display: none;
            box-shadow: 0 0 5px red;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    
    <div id="ui-layer">
        <div id="crosshair"></div>
        <div class="dot-sight" id="dot-sight"></div>
        <div id="hud">Ammo: <span id="ammo-count">30</span></div>
        <div id="health-bar"><div id="health-fill"></div></div>
    </div>

    <!-- Login Screen -->
    <div id="login-screen">
        <h1 class="text-5xl text-white font-bold mb-8">Apex Clone Prototype</h1>
        <button id="login-btn" class="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xl font-semibold shadow-lg transition-colors">
            Login with Google
        </button>
        <p id="auth-status" class="text-gray-300 mt-4"></p>
    </div>

    <!-- Instructions Screen (Shown after login, before game starts) -->
    <div id="instructions">
        <h2 class="text-4xl font-bold mb-4">Click to Play</h2>
        <div class="text-lg space-y-2 text-center max-w-md">
            <p><strong>W, A, S, D:</strong> Move</p>
            <p><strong>Mouse:</strong> Look</p>
            <p><strong>Space / Scroll Down:</strong> Jump (B-hop)</p>
            <p><strong>Shift (Hold):</strong> Crouch / Slide</p>
            <p><strong>Scroll Up:</strong> Forward Micro-boost (Tap Strafe)</p>
            <p><strong>Right Click (Hold):</strong> ADS</p>
            <p><strong>Move into wall:</strong> Climb</p>
            <p><strong>Jump while climbing:</strong> Wall Bounce</p>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        
        // Three.js and Cannon.js
        import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js';
        
        // --- Firebase Setup ---
        const firebaseConfig = {
            apiKey: "AIzaSyDqkUSfY2goeCeFaCx3Z_1ZJU-NfnZMYPQ",
            authDomain: "task111-9b8f8.firebaseapp.com",
            projectId: "task111-9b8f8",
            storageBucket: "task111-9b8f8.firebasestorage.app",
            messagingSenderId: "194272968746",
            appId: "1:194272968746:web:5ba2bf82290b9ba2838353"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;

        const loginBtn = document.getElementById('login-btn');
        const loginScreen = document.getElementById('login-screen');
        const authStatus = document.getElementById('auth-status');
        const instructions = document.getElementById('instructions');

        loginBtn.addEventListener('click', () => {
            authStatus.innerText = "Logging in...";
            signInWithPopup(auth, provider).catch((error) => {
                console.error("Auth Error", error);
                authStatus.innerText = "Login failed. Try again.";
            });
        });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                loginScreen.style.display = 'none';
                instructions.style.display = 'flex';
                initGame(); // Start game logic once authenticated
            } else {
                loginScreen.style.display = 'flex';
                instructions.style.display = 'none';
            }
        });

        // --- Game Logic ---
        function initGame() {
            // UI Elements
            const crosshair = document.getElementById('crosshair');
            const hud = document.getElementById('hud');
            const healthBar = document.getElementById('health-bar');
            const dotSight = document.getElementById('dot-sight');
            const ammoCountSpan = document.getElementById('ammo-count');

            // --- Three.js Setup ---
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb); // Sky blue
            scene.fog = new THREE.Fog(0x87ceeb, 0, 750);

            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0x404040, 0.5); // Soft white light
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(100, 200, 50);
            directionalLight.castShadow = true;
            scene.add(directionalLight);

            // --- Environment ---
            const floorGeometry = new THREE.PlaneGeometry(2000, 2000, 100, 100);
            floorGeometry.rotateX(-Math.PI / 2);
            // Simple grid texture logic
            const floorMaterial = new THREE.MeshLambertMaterial({ color: 0x555555, wireframe: false });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.receiveShadow = true;
            scene.add(floor);

            // Add some obstacles/walls
            const walls = [];
            const boxGeo = new THREE.BoxGeometry(20, 20, 20);
            const boxMat = new THREE.MeshLambertMaterial({ color: 0x888888 });
            
            for(let i=0; i<10; i++) {
                const box = new THREE.Mesh(boxGeo, boxMat);
                box.position.x = (Math.random() - 0.5) * 200;
                box.position.y = 10;
                box.position.z = (Math.random() - 0.5) * 200;
                box.castShadow = true;
                box.receiveShadow = true;
                scene.add(box);
                walls.push(box);
            }

            // Tall wall for climbing
            const tallWallGeo = new THREE.BoxGeometry(40, 100, 10);
            const tallWallMat = new THREE.MeshLambertMaterial({ color: 0xaa5555 });
            const tallWall = new THREE.Mesh(tallWallGeo, tallWallMat);
            tallWall.position.set(0, 50, -50);
            scene.add(tallWall);
            walls.push(tallWall);


            // --- Player/Camera Setup ---
            const playerHeight = 15;
            const crouchHeight = 8;
            camera.position.y = playerHeight;
            
            const pitchObject = new THREE.Object3D();
            pitchObject.add(camera);
            const yawObject = new THREE.Object3D();
            yawObject.position.y = 10;
            yawObject.add(pitchObject);
            scene.add(yawObject);

            // Weapon Model (Simple Box attached to camera)
            const weaponGeo = new THREE.BoxGeometry(1, 1, 4);
            const weaponMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
            const weapon = new THREE.Mesh(weaponGeo, weaponMat);
            weapon.position.set(2, -1, -3); // Offset from camera center
            camera.add(weapon); // Attach to camera so it moves with view

            // --- Game State & Physics Variables ---
            const state = {
                moveForward: false, moveBackward: false, moveLeft: false, moveRight: false,
                isCrouching: false, isSliding: false, isGrounded: true, isClimbing: false,
                isADS: false
            };

            const velocity = new THREE.Vector3();
            const direction = new THREE.Vector3();
            
            const config = {
                speed: 60.0, // Base run speed
                slideSpeedMultiplier: 1.8,
                crouchSpeed: 20.0,
                jumpVelocity: 150.0,
                gravity: 400.0,
                friction: 10.0,
                slideFriction: 2.0, // Less friction when sliding
                airControl: 0.5,
                climbSpeed: 30.0,
                wallBounceForce: 200.0,
                tapStrafeBoost: 20.0
            };

            let ammo = 30;
            let currentWall = null;

            // --- Controls ---
            const onKeyDown = function ( event ) {
                switch ( event.code ) {
                    case 'ArrowUp': case 'KeyW': state.moveForward = true; break;
                    case 'ArrowLeft': case 'KeyA': state.moveLeft = true; break;
                    case 'ArrowDown': case 'KeyS': state.moveBackward = true; break;
                    case 'ArrowRight': case 'KeyD': state.moveRight = true; break;
                    case 'Space': 
                        if (state.isClimbing) doWallBounce();
                        else doJump(); 
                        break;
                    case 'ShiftLeft': 
                        if(state.isGrounded && (state.moveForward || state.moveLeft || state.moveRight)) {
                            state.isSliding = true;
                        }
                        state.isCrouching = true; 
                        break;
                }
            };

            const onKeyUp = function ( event ) {
                switch ( event.code ) {
                    case 'ArrowUp': case 'KeyW': state.moveForward = false; break;
                    case 'ArrowLeft': case 'KeyA': state.moveLeft = false; break;
                    case 'ArrowDown': case 'KeyS': state.moveBackward = false; break;
                    case 'ArrowRight': case 'KeyD': state.moveRight = false; break;
                    case 'ShiftLeft': 
                        state.isCrouching = false; 
                        state.isSliding = false;
                        camera.position.y = playerHeight;
                        break;
                }
            };

            document.addEventListener( 'keydown', onKeyDown );
            document.addEventListener( 'keyup', onKeyUp );

            // Mouse Look
            const PI_2 = Math.PI / 2;
            document.addEventListener('mousemove', (event) => {
                if (document.pointerLockElement !== document.body) return;
                
                const movementX = event.movementX || event.mozMovementX || event.webkitMovementX || 0;
                const movementY = event.movementY || event.mozMovementY || event.webkitMovementY || 0;

                const sensitivity = state.isADS ? 0.001 : 0.002;
                yawObject.rotation.y -= movementX * sensitivity;
                pitchObject.rotation.x -= movementY * sensitivity;
                pitchObject.rotation.x = Math.max(-PI_2, Math.min(PI_2, pitchObject.rotation.x));
            });

            // ADS
            document.addEventListener('mousedown', (e) => {
                if (document.pointerLockElement !== document.body) return;
                if (e.button === 2) { // Right click
                    state.isADS = true;
                    // Move weapon to center
                    weapon.position.set(0, -0.5, -2);
                    camera.fov = 45; // Zoom in
                    camera.updateProjectionMatrix();
                    crosshair.style.display = 'none';
                    dotSight.style.display = 'block';
                }
            });

            document.addEventListener('mouseup', (e) => {
                if (e.button === 2) {
                    state.isADS = false;
                    weapon.position.set(2, -1, -3);
                    camera.fov = 75; // Zoom out
                    camera.updateProjectionMatrix();
                    crosshair.style.display = 'block';
                    dotSight.style.display = 'none';
                }
            });

            // Scroll Wheel for Tap Strafe and B-hop
            document.addEventListener('wheel', (e) => {
                if (document.pointerLockElement !== document.body) return;
                
                if (e.deltaY > 0) {
                    // Scroll down: Jump (B-hop)
                    doJump();
                } else if (e.deltaY < 0 && !state.isGrounded) {
                    // Scroll up: Tap Strafe (Micro forward boost + allow sharp turn)
                    // If holding left/right while scrolling up, apply strong force in that direction relative to look direction
                    const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(yawObject.quaternion);
                    velocity.add(forward.multiplyScalar(config.tapStrafeBoost));
                    
                    // Simple logic to allow 90 degree air turn
                    if(state.moveLeft) {
                        const left = new THREE.Vector3(-1, 0, 0).applyQuaternion(yawObject.quaternion);
                        velocity.add(left.multiplyScalar(config.tapStrafeBoost * 2));
                    }
                    if(state.moveRight) {
                        const right = new THREE.Vector3(1, 0, 0).applyQuaternion(yawObject.quaternion);
                        velocity.add(right.multiplyScalar(config.tapStrafeBoost * 2));
                    }
                }
            });

            // Prevent context menu
            document.addEventListener('contextmenu', e => e.preventDefault());

            // Pointer Lock setup
            instructions.addEventListener('click', () => {
                document.body.requestPointerLock();
            });

            document.addEventListener('pointerlockchange', () => {
                if (document.pointerLockElement === document.body) {
                    instructions.style.display = 'none';
                    crosshair.style.display = 'block';
                    hud.style.display = 'block';
                    healthBar.style.display = 'block';
                } else {
                    instructions.style.display = 'flex';
                    crosshair.style.display = 'none';
                    hud.style.display = 'none';
                    healthBar.style.display = 'none';
                    dotSight.style.display = 'none';
                }
            });

            // --- Actions ---
            function doJump() {
                if (state.isGrounded || state.isSliding) {
                    velocity.y = Math.max(velocity.y, config.jumpVelocity);
                    state.isGrounded = false;
                    state.isSliding = false; // Jumping cancels slide state mostly
                }
            }

            function doWallBounce() {
                if(!currentWall) return;
                state.isClimbing = false;
                
                // Bounce away from the wall
                // Simple logic: push opposite to looking direction horizontally + upwards
                const pushBack = new THREE.Vector3(0, 0, 1).applyQuaternion(yawObject.quaternion);
                pushBack.y = 0; // horizontal only
                pushBack.normalize();
                
                velocity.x = pushBack.x * config.wallBounceForce;
                velocity.z = pushBack.z * config.wallBounceForce;
                velocity.y = config.jumpVelocity * 1.2; // higher jump off wall
                
                currentWall = null;
            }


            // --- Raycaster for Collisions ---
            const raycaster = new THREE.Raycaster();
            const playerRadius = 2;

            function checkCollisions() {
                // Ground collision is simple y>0 logic for now
                // Wall collisions
                const pos = yawObject.position.clone();
                const directions = [
                    new THREE.Vector3(1, 0, 0), new THREE.Vector3(-1, 0, 0),
                    new THREE.Vector3(0, 0, 1), new THREE.Vector3(0, 0, -1),
                    new THREE.Vector3(0.7, 0, 0.7), new THREE.Vector3(-0.7, 0, -0.7),
                    new THREE.Vector3(0.7, 0, -0.7), new THREE.Vector3(-0.7, 0, 0.7)
                ];

                state.isClimbing = false;
                currentWall = null;

                for (let dir of directions) {
                    raycaster.set(pos, dir);
                    const intersects = raycaster.intersectObjects(walls);
                    if (intersects.length > 0 && intersects[0].distance < playerRadius) {
                        // Collision
                        const normal = intersects[0].face.normal;
                        
                        // Push back
                        yawObject.position.add(normal.clone().multiplyScalar(playerRadius - intersects[0].distance));
                        
                        // Stop velocity in normal direction
                        const dot = velocity.dot(normal);
                        if(dot < 0) {
                            velocity.sub(normal.multiplyScalar(dot));
                        }

                        // Wall Climb Check: If moving forward into wall while airborne
                        if(!state.isGrounded && state.moveForward) {
                            // Check if looking roughly at the wall
                            const lookDir = new THREE.Vector3(0,0,-1).applyQuaternion(yawObject.quaternion);
                            if(lookDir.dot(normal) < -0.5) {
                                state.isClimbing = true;
                                currentWall = intersects[0].object;
                            }
                        }
                    }
                }
            }


            // --- Main Loop ---
            let prevTime = performance.now();

            function animate() {
                requestAnimationFrame( animate );

                const time = performance.now();
                const delta = ( time - prevTime ) / 1000;

                if ( document.pointerLockElement === document.body ) {

                    // Determine Current Movement Speed and Friction
                    let currentSpeed = state.isCrouching ? config.crouchSpeed : config.speed;
                    let currentFriction = config.friction;

                    if (state.isSliding) {
                        // Sliding logic: keep velocity, low friction, camera down
                        camera.position.y = THREE.MathUtils.lerp(camera.position.y, crouchHeight, 0.2);
                        currentFriction = config.slideFriction;
                    } else if (state.isCrouching) {
                        camera.position.y = THREE.MathUtils.lerp(camera.position.y, crouchHeight, 0.2);
                    } else {
                        camera.position.y = THREE.MathUtils.lerp(camera.position.y, playerHeight, 0.2);
                    }

                    if (!state.isGrounded) {
                        currentFriction = config.airControl; // Less control in air
                    }

                    // Apply Damping (Friction)
                    velocity.x -= velocity.x * currentFriction * delta;
                    velocity.z -= velocity.z * currentFriction * delta;

                    if (state.isClimbing) {
                        velocity.y = config.climbSpeed; // Constant upward speed
                        velocity.x *= 0.8; // Dampen horizontal movement
                        velocity.z *= 0.8;
                    } else {
                        velocity.y -= config.gravity * delta; // Apply Gravity
                    }

                    // Input movement
                    direction.z = Number( state.moveForward ) - Number( state.moveBackward );
                    direction.x = Number( state.moveRight ) - Number( state.moveLeft );
                    direction.normalize(); // consistent movement in all directions

                    if ( state.moveForward || state.moveBackward ) {
                        // Apply movement based on yaw rotation
                        velocity.z -= direction.z * currentSpeed * delta;
                    }
                    if ( state.moveLeft || state.moveRight ) {
                        velocity.x -= direction.x * currentSpeed * delta;
                    }

                    // Translate velocity to world space relative to camera yaw
                    const vRight = new THREE.Vector3(1,0,0).applyQuaternion(yawObject.quaternion);
                    const vForward = new THREE.Vector3(0,0,-1).applyQuaternion(yawObject.quaternion);
                    
                    const moveVector = new THREE.Vector3();
                    moveVector.add(vRight.multiplyScalar(velocity.x * delta));
                    moveVector.add(vForward.multiplyScalar(-velocity.z * delta)); // Note the negative sign

                    yawObject.position.x += moveVector.x;
                    yawObject.position.z += moveVector.z;
                    yawObject.position.y += velocity.y * delta;

                    checkCollisions();

                    // Floor Collision
                    if ( yawObject.position.y < playerHeight ) {
                        velocity.y = 0;
                        yawObject.position.y = playerHeight;
                        state.isGrounded = true;
                        
                        // Auto-cancel slide if moving too slow
                        if(state.isSliding && (Math.abs(velocity.x) + Math.abs(velocity.z) < 10)) {
                            state.isSliding = false;
                        }
                    }

                }

                renderer.render( scene, camera );
                prevTime = time;
            }

            animate();
            
            // Handle Resize
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }
    </script>
</body>
</html>
