<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apex Arena 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #10131a; --panel: #1a2030; --red: #ff4d3d; --steel: #8fa3b8; --ice: #e8f1f8; --sh: #4cc3ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ice); font-family: "Rajdhani", "Noto Sans JP", system-ui, sans-serif; overflow: hidden; font-size: 18px; }
  canvas { display: block; }
  .ov { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: rgba(12, 15, 22, 0.92); z-index: 10; text-align: center; padding: 20px; }
  .hide { display: none !important; }
  h1 { font-size: clamp(40px, 8vw, 84px); margin: 0; font-weight: 700; line-height: 1; letter-spacing: -1px; transform: skewX(-8deg); }
  h1 b { color: var(--red); }
  p { margin: 0; color: var(--steel); }
  button { font: inherit; font-weight: 700; background: var(--red); color: #fff; border: 0; padding: 12px 30px; cursor: pointer; clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%); }
  button:hover, button:focus-visible { background: #ff7060; outline: none; }
  button.alt { background: var(--panel); color: var(--ice); }
  button.sel { background: var(--ice); color: var(--bg); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center; }
  .card { background: var(--panel); padding: 14px 20px; min-width: 260px; border-left: 4px solid var(--red); text-align: left; }
  .card ol { margin: 6px 0 0; padding-left: 22px; color: var(--steel); }
  #user { display: flex; align-items: center; gap: 10px; }
  #user img { width: 40px; height: 40px; border-radius: 50%; }
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  #cross { position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px; border: 2px solid #fff; border-radius: 50%; opacity: 0.8; }
  #cross.hit { border-color: var(--red); transform: scale(1.5); }
  #scope { position: absolute; inset: 0; opacity: 0; background: radial-gradient(circle at center, transparent 35%, rgba(0,0,0,0.6) 100%); }
  #dot { position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: #ff2a2a; box-shadow: 0 0 6px 2px rgba(255, 40, 40, 0.8); opacity: 0; }
  #bars { position: absolute; left: 24px; bottom: 24px; width: 280px; }
  .bar { height: 12px; background: rgba(0,0,0,0.5); margin-top: 6px; transform: skewX(-20deg); }
  .bar i { display: block; height: 100%; width: 100%; transition: width 0.2s; }
  #hp i { background: #5be37d; } #sh i { background: var(--sh); }
  #ammo { position: absolute; right: 28px; bottom: 24px; font-size: 56px; font-weight: 700; text-align: right; line-height: 1; }
  #ammo small { display: block; font-size: 18px; color: var(--steel); font-weight: 500; }
  #top { position: absolute; top: 18px; left: 0; right: 0; text-align: center; font-size: 24px; font-weight: 700; }
  #abil { position: absolute; left: 24px; bottom: 96px; font-size: 18px; color: var(--steel); }
  #banner { position: absolute; top: 22%; left: 0; right: 0; text-align: center; font-size: 44px; font-weight: 700; opacity: 0; transition: opacity 0.4s; }
  #flash { position: absolute; inset: 0; box-shadow: inset 0 0 160px rgba(255, 40, 30, 0.9); opacity: 0; transition: opacity 0.25s; }
  @media (prefers-reduced-motion: reduce) { #banner, #flash, #cross { transition: none; } }
</style>
<!-- スペース問題やバージョン不整合を防ぐため、Three.jsを直接import -->
<script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
</script>
</head>
<body>

<div id="login" class="ov">
  <h1>APEX <b>ARENA</b></h1>
  <p>3Dアリーナで敵部隊を倒し続けよう。</p>
  <button id="btnLogin">Googleでログイン</button>
  <p id="loginErr"></p>
</div>

<div id="menu" class="ov hide">
  <div id="user">
    <img id="uImg" src="" alt="icon">
    <div style="text-align:left">
      <b id="uName"></b>
      <p id="uStat"></p>
    </div>
  </div>
  <p>レジェンドを選択</p>
  <div class="row" id="legends"></div>
  <p id="legDesc"></p>
  <div class="row">
    <button id="btnStart">出撃</button>
    <button id="btnOut" class="alt">ログアウト</button>
  </div>
  <div class="card">
    <b>ランキング (最多キル)</b>
    <ol id="board"></ol>
  </div>
  <p>WASD 移動(常時ダッシュ) / Shift しゃがみ・スライディング / Space ジャンプ / 左クリック 射撃 / 右クリック スコープ / R リロード / Q アビリティ</p>
</div>

<div id="pause" class="ov hide">
  <h1>PAUSE</h1>
  <p>クリックして再開</p>
</div>

<div id="over" class="ov hide">
  <h1>DOWNED</h1>
  <p id="result"></p>
  <p id="saveMsg"></p>
  <button id="btnBack">メニューへ戻る</button>
</div>

<div id="hud" class="hide">
  <div id="top"><span id="wave"></span> ・ <span id="kills"></span></div>
  <div id="scope"></div>
  <div id="dot"></div>
  <div id="cross"></div>
  <div id="banner"></div>
  <div id="abil"></div>
  <div id="bars">
    <div class="bar" id="sh"><i></i></div>
    <div class="bar" id="hp"><i></i></div>
  </div>
  <div id="ammo"><span id="am">30</span><small id="reload"></small></div>
  <div id="flash"></div>
</div>

<script type="module">
import * as THREE from 'three';
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, doc, getDoc, setDoc, collection, query, orderBy, limit, getDocs, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

// Firebase初期化 (提供された設定を使用)
const firebaseConfig = {
  apiKey: "AIzaSyDqkUSfY2goeCeFaCx3Z_1ZJU-NfnZMYPQ",
  authDomain: "task111-9b8f8.firebaseapp.com",
  projectId: "task111-9b8f8",
  storageBucket: "task111-9b8f8.firebasestorage.app",
  messagingSenderId: "194272968746",
  appId: "1:194272968746:web:5ba2bf82290b9ba2838353"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = id => document.getElementById(id);
const show = (id, v) => $(id).classList.toggle('hide', !v);

/* ---------- 認証・保存 ---------- */
let user = null;
let profile = {};

$('btnLogin').onclick = async () => {$('loginErr').textContent = '';
  try {
    await signInWithPopup(auth, new GoogleAuthProvider());
  } catch(e) {
    $('loginErr').textContent = 'ログイン失敗: ' + (e.code || e.message);
  }
};

$('btnOut').onclick = () => signOut(auth);

onAuthStateChanged(auth, async u => {
  user = u;
  if (!u) {
    show('login', 1);
    show('menu', 0);
    return;
  }
  show('login', 0);
  show('menu', 1);
  $('uName').textContent = u.displayName \vert{}\vert{} 'Player';$('uImg').src = u.photoURL || '';
  await loadProfile();
  loadBoard();
});

async function loadProfile() {
  try {
    const s = await getDoc(doc(db, 'players', user.uid));
    profile = s.exists() ? s.data() : {};
  } catch(e) {
    profile = {};
  }
  $('uStat').textContent = `出撃 ${profile.games || 0}回 / 総キル ${profile.totalKills || 0} / 最高ウェーブ ${profile.bestWave || 0}`;
}

async function loadBoard() {
  const ol = $('board');
  ol.innerHTML = '';
  try {
    const qs = await getDocs(query(collection(db, 'players'), orderBy('bestKills', 'desc'), limit(5)));
    qs.forEach(d => {
      const x = d.data();
      const li = document.createElement('li');
      li.textContent = `${x.name || 'Player'} - ${x.bestKills || 0}キル`;
      ol.appendChild(li);
    });
    if (!ol.children.length) {
      const li = document.createElement('li');
      li.textContent = '記録なし';
      ol.appendChild(li);
    }
  } catch(e) {
    const li = document.createElement('li');
    li.textContent = 'ランキング取得エラー';
    ol.appendChild(li);
  }
}

async function saveResult(kills, wave) {
  $('saveMsg').textContent = '保存中...';
  try {
    const ref = doc(db, 'players', user.uid);
    const s = await getDoc(ref);
    const o = s.exists() ? s.data() : {};
    const data = {
      name: user.displayName || 'Player',
      photo: user.photoURL || '',
      bestKills: Math.max(o.bestKills || 0, kills),
      bestWave: Math.max(o.bestWave || 0, wave),
      totalKills: (o.totalKills || 0) + kills,
      games: (o.games || 0) + 1,
      legend: G.legend,
      updatedAt: serverTimestamp()
    };
    await setDoc(ref, data);
    $('saveMsg').textContent = '戦績を保存しました';
  } catch(e) {
    $('saveMsg').textContent = '保存失敗: ' + (e.code || e.message);
  }
}

/* ---------- レジェンド ---------- */
const LEG = {
  wraith: { n: 'レイス', d: 'Q: 前方へ瞬間ダッシュ(CT 6秒)', cd: 6 },
  lifeline: { n: 'ライフライン', d: 'Q: 体力を40回復(CT 14秒)', cd: 14 },
  octane: { n: 'オクタン', d: 'Q: 4秒間 移動速度1.5倍(CT 10秒)', cd: 10 }
};
let pick = 'wraith';

function drawLegends() {
  const box = $('legends');
  box.innerHTML = '';
  for (const k in LEG) {
    const b = document.createElement('button');
    b.textContent = LEG[k].n;
    b.className = (k === pick) ? 'sel' : 'alt';
    b.onclick = () => { pick = k; drawLegends(); };
    box.appendChild(b);
  }
  $('legDesc').textContent = LEG[pick].d;
}
drawLegends();

/* ---------- 3Dシーン構築 ---------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9cc3e6);
scene.fog = new THREE.Fog(0x9cc3e6, 35, 130);

const cam = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 200);
cam.rotation.order = 'YXZ';
scene.add(cam);

const ren = new THREE.WebGLRenderer({ antialias: true });
ren.setSize(innerWidth, innerHeight);
ren.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.prepend(ren.domElement);

window.addEventListener('resize', () => {
  cam.aspect = innerWidth / innerHeight;
  cam.updateProjectionMatrix();
  ren.setSize(innerWidth, innerHeight);
});

scene.add(new THREE.HemisphereLight(0xffffff, 0x44505e, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.3);
sun.position.set(30, 60, 20);
scene.add(sun);

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(100, 100),
  new THREE.MeshLambertMaterial({ color: 0x3a463c })
);
floor.rotation.x = -Math.PI / 2;
scene.add(floor);
scene.add(new THREE.GridHelper(100, 50, 0x55665a, 0x4a5a4e));

const boxes = [];
const wallMats = [0x6b7280, 0x8a6d4b, 0x4b5d7a].map(c => new THREE.MeshLambertMaterial({ color: c }));

function addBox(x, z, w, h, d) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMats[boxes.length % 3]);
  m.position.set(x, h / 2, z);
  scene.add(m);
  m.updateMatrixWorld();
  boxes.push({ m, b: new THREE.Box3().setFromObject(m) });
}

let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
for (let i = 0; i < 44; i++) {
  const x = (rnd() - 0.5) * 88;
  const z = (rnd() - 0.5) * 88;
  if (Math.hypot(x, z) < 9) continue;
  addBox(x, z, 2 + rnd() * 6, 1 + rnd() * 4, 2 + rnd() * 6);
}
addBox(0, -51, 104, 8, 2);
addBox(0, 51, 104, 8, 2);
addBox(-51, 0, 2, 8, 104);
addBox(51, 0, 2, 8, 104);

/* ---------- 武器モデル ---------- */
const gun = new THREE.Group();
const MT = (c, m=0.6, r=0.45) => new THREE.MeshStandardMaterial({ color: c, metalness: m, roughness: r });
const dark = MT(0x1f2329);
const mid = MT(0x3a404a);
const poly = MT(0x15171b, 0.1, 0.8);
const B = (w, h, d) => new THREE.BoxGeometry(w, h, d);
const cyl = (r, l) => {
  const g = new THREE.CylinderGeometry(r, r, l, 12);
  g.rotateX(Math.PI / 2);
  return g;
};
const part = (geo, mat, x, y, z, rx=0) => {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.rotation.x = rx;
  gun.add(m);
  return m;
};

part(B(0.06, 0.09, 0.34), dark, 0, 0, 0); // レシーバー
part(B(0.05, 0.015, 0.3), mid, 0, 0.0525, 0); // トップ
part(B(0.055, 0.07, 0.2), mid, 0, 0, -0.27); // ハンドガード
part(cyl(0.011, 0.3), dark, 0, 0.02, -0.32); // バレル
part(cyl(0.016, 0.05), dark, 0, 0.02, -0.465); // マズル
part(B(0.02, 0.008, 0.2), dark, 0, 0.039, -0.27); // レール
part(B(0.006, 0.03, 0.006), dark, 0, 0.055, -0.34); // サイト
part(B(0.04, 0.14, 0.07), poly, 0, -0.11, -0.04, 0.12); // マガジン
part(B(0.035, 0.09, 0.045), poly, 0, -0.085, 0.1, -0.3); // グリップ
part(B(0.045, 0.08, 0.2), poly, 0, -0.005, 0.27); // ストック
part(B(0.045, 0.012, 0.07), dark, 0, 0.066, 0.04); // ドット土台
part(B(0.006, 0.045, 0.03), dark, -0.021, 0.0945, 0.04);
part(B(0.006, 0.045, 0.03), dark, 0.021, 0.0945, 0.04);
part(B(0.048, 0.008, 0.03), dark, 0, 0.1175, 0.04);
part(new THREE.PlaneGeometry(0.036, 0.04), new THREE.MeshBasicMaterial({ color: 0x66aaff, transparent: true, opacity: 0.12, side: THREE.DoubleSide }), 0, 0.0945, 0.04);

const flash = part(new THREE.SphereGeometry(0.035, 8, 6), new THREE.MeshBasicMaterial({ color: 0xffc060 }), 0, 0.02, -0.5);
flash.visible = false;
gun.position.set(0.22, -0.2, -0.5);
cam.add(gun);

/* ---------- 当たり判定 ---------- */
function collide(p, r, feet) {
  let g = 0;
  for (const { b } of boxes) {
    if (p.x > b.min.x - r && p.x < b.max.x + r && p.z > b.min.z - r && p.z < b.max.z + r) {
      if (b.max.y <= feet + 0.6) {
        g = Math.max(g, b.max.y);
      } else if (feet < b.max.y) {
        const a = b.max.x + r - p.x;
        const c = p.x - (b.min.x - r);
        const d = b.max.z + r - p.z;
        const e = p.z - (b.min.z - r);
        const m = Math.min(a, c, d, e);
        if (m === a) p.x = b.max.x + r;
        else if (m === c) p.x = b.min.x - r;
        else if (m === d) p.z = b.max.z + r;
        else p.z = b.min.z - r;
      }
    }
  }
  return g;
}

/* ---------- ゲーム状態 ---------- */
const G = { running: false, over: false, legend: 'wraith' };
const P = {
  pos: new THREE.Vector3(), vy: 0, ground: true, yaw: 0, pitch: 0,
  hp: 100, sh: 50, ammo: 30, reload: 0, fireT: 0, cd: 0, dash: 0, boost: 0,
  kills: 0, wave: 0, kick: 0, eye: 1.7, adsT: 0, slide: 0, sdx: 0, sdz: -1, lx: 0, lz: -1, flashT: 0
};
let enemies = [];
let tracers = [];
let keys = {};
let fire = false;
let adsHeld = false;
let locked = false;
let waveWait = 0;

const rc = new THREE.Raycaster();
const eMatBody = new THREE.MeshLambertMaterial({ color: 0xc0392b });
const eMatHead = new THREE.MeshLambertMaterial({ color: 0xf0c8a0 });
const eMatLeg = new THREE.MeshLambertMaterial({ color: 0x2c3e50 });

function spawnEnemy() {
  const g = new THREE.Group();
  const e = { g, hp: 100, cd: 1 + Math.random() * 1.5, side: Math.random() < 0.5 ? 1 : -1, meshes: [] };
  const parts = [
    [new THREE.BoxGeometry(0.8, 1, 0.5), eMatBody, 0.95, 0],
    [new THREE.BoxGeometry(0.7, 0.6, 0.4), eMatLeg, 0.3, 0],
    [new THREE.SphereGeometry(0.26, 10, 8), eMatHead, 1.7, 1]
  ];
  for (const [geo, mat, y, head] of parts) {
    const m = new THREE.Mesh(geo, mat);
    m.position.y = y;
    m.userData = { enemy: e, head: !!head };
    g.add(m);
    e.meshes.push(m);
  }
  const a = Math.random() * Math.PI * 2;
  const r = 34 + Math.random() * 8;
  g.position.set(Math.cos(a) * r, 0, Math.sin(a) * r);
  scene.add(g);
  enemies.push(e);
}

function nextWave() {
  P.wave++;
  P.sh = Math.min(50, P.sh + 30);
  P.hp = Math.min(100, P.hp + 20);
  for (let i = 0; i < 2 + P.wave; i++) spawnEnemy();
  banner(`ウェーブ ${P.wave}`);
}

function banner(t) {
  const b = $('banner');
  b.textContent = t;
  b.style.opacity = 1;
  setTimeout(() => b.style.opacity = 0, 1600);
}

function startGame() {
  G.legend = pick;
  G.running = true;
  G.over = false;
  Object.assign(P, {
    vy: 0, ground: true, yaw: 0, pitch: 0, hp: 100, sh: 50, ammo: 30,
    reload: 0, fireT: 0, cd: 0, dash: 0, boost: 0, kills: 0, wave: 0,
    kick: 0, eye: 1.7, adsT: 0, slide: 0, sdx: 0, sdz: -1, lx: 0, lz: -1, flashT: 0
  });
  P.pos.set(0, 0, 0);
  enemies.forEach(e => scene.remove(e.g));
  enemies = [];
  adsHeld = false;
  fire = false;
  show('menu', 0);
  show('over', 0);
  show('hud', 1);
  show('pause', 0);
  nextWave();
  ren.domElement.requestPointerLock();
}

$('btnStart').onclick = startGame;
$('pause').onclick = () => ren.domElement.requestPointerLock();$('btnBack').onclick = async () => {
  show('over', 0);
  show('menu', 1);
  await loadProfile();
  loadBoard();
};

document.addEventListener('pointerlockchange', () => {
  locked = document.pointerLockElement === ren.domElement;
  if (G.running && !G.over) show('pause', !locked);
});

window.addEventListener('mousemove', e => {
  if (!locked) return;
  const k = 0.0022 * (1 - 0.5 * P.adsT);
  P.yaw -= e.movementX * k;
  P.pitch = Math.max(-1.45, Math.min(1.45, P.pitch - e.movementY * k));
});

window.addEventListener('mousedown', e => {
  if (e.button === 0) fire = true;
  if (e.button === 2) adsHeld = true;
});

window.addEventListener('mouseup', e => {
  if (e.button === 0) fire = false;
  if (e.button === 2) adsHeld = false;
});

window.addEventListener('contextmenu', e => {
  if (G.running) e.preventDefault();
});

window.addEventListener('keydown', e => {
  keys[e.code] = 1;
  if (e.code.startsWith('Shift')) keys.Shift = 1;
  if (!locked) return;
  
  if (e.code === 'KeyR') reload();
  if (e.code === 'KeyQ') ability();
  
  if (e.code.startsWith('Shift') && !e.repeat && P.ground && P.slide <= 0 && (keys.KeyW || keys.KeyA || keys.KeyS || keys.KeyD)) {
    P.slide = 0.9;
    P.sdx = P.lx;
    P.sdz = P.lz;
  }
  if (e.code === 'Space') e.preventDefault();
});

window.addEventListener('keyup', e => {
  keys[e.code] = 0;
  if (e.code.startsWith('Shift')) keys.Shift = 0;
});

function reload() {
  if (!P.reload && P.ammo < 30) P.reload = 1.6;
}

function ability() {
  if (P.cd > 0) return;
  P.cd = LEG[G.legend].cd;
  if (G.legend === 'wraith') P.dash = 0.25;
  else if (G.legend === 'lifeline') P.hp = Math.min(100, P.hp + 40);
  else P.boost = 4;
}

function dmgPlayer(n) {
  if (G.over) return;
  const a = Math.min(P.sh, n);
  P.sh -= a;
  n -= a;
  P.hp -= n;
  $('flash').style.opacity = 1;
  setTimeout(() => $('flash').style.opacity = 0, 120);
  if (P.hp <= 0) die();
}

function tracer(a, b, color) {
  const l = new THREE.Line(new THREE.BufferGeometry().setFromPoints([a, b]), new THREE.LineBasicMaterial({ color }));
  scene.add(l);
  tracers.push({ l, t: 0.06 });
}

const dir = new THREE.Vector3();
const org = new THREE.Vector3();

function shoot() {
  P.ammo--;
  P.fireT = 0.09;
  P.kick = 0.04;
  P.pitch += 0.006;
  flash.visible = true;
  P.flashT = 0.04;
  
  cam.getWorldDirection(dir);
  const sg = 0.02 * (1 - 0.7 * P.adsT);
  dir.x += (Math.random() - 0.5) * sg;
  dir.y += (Math.random() - 0.5) * sg;
  dir.z += (Math.random() - 0.5) * sg;
  dir.normalize();
  
  cam.getWorldPosition(org);
  rc.set(org, dir);
  rc.far = 150;
  
  const hits = rc.intersectObjects([...boxes.map(o => o.m), ...enemies.flatMap(e => e.meshes)], false);
  const from = gun.localToWorld(new THREE.Vector3(0, 0.02, -0.5));
  let end = org.clone().addScaledVector(dir, 120);
  
  if (hits.length) {
    const h = hits[0];
    end = h.point;
    const e = h.object.userData.enemy;
    if (e) {
      e.hp -= h.object.userData.head ? 40 : 20;
      const c = $('cross');
      c.classList.add('hit');
      setTimeout(() => c.classList.remove('hit'), 90);
      if (e.hp <= 0) {
        scene.remove(e.g);
        enemies = enemies.filter(x => x !== e);
        P.kills++;
      }
    }
  }
  tracer(from, end, 0xffe27a);
}

async function die() {
  G.over = true;
  G.running = false;
  adsHeld = false;
  fire = false;
  cam.fov = 75;
  cam.updateProjectionMatrix();
  document.exitPointerLock();
  show('hud', 0);
  show('pause', 0);
  show('over', 1);
  $('result').textContent = `ウェーブ ${P.wave} / キル ${P.kills}`;
  await saveResult(P.kills, P.wave);
}

function update(dt) {
  // 移動処理
  const f = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0);
  const r = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);
  const sy = Math.sin(P.yaw);
  const cy = Math.cos(P.yaw);
  let mx = -sy * f + cy * r;
  let mz = -cy * f - sy * r;
  
  const l = Math.hypot(mx, mz);
  if (l > 1) { mx /= l; mz /= l; }
  if (mx || mz) { P.lx = mx; P.lz = mz; }
  
  const crouch = keys.Shift && P.slide <= 0;
  let sp = (crouch ? 3.5 : 9) * (P.boost > 0 ? 1.5 : 1) * (adsHeld ? 0.65 : 1);
  
  if (P.slide > 0) {
    P.slide -= dt;
    if (!keys.Shift || keys.Space || !P.ground) P.slide = 0;
    mx = P.sdx;
    mz = P.sdz;
    sp = 7 + 9 * Math.max(0, P.slide) / 0.9;
  }
  
  P.pos.x += mx * sp * dt;
  P.pos.z += mz * sp * dt;
  
  if (P.dash > 0) {
    P.dash -= dt;
    P.pos.x += -sy * 26 * dt;
    P.pos.z += -cy * 26 * dt;
  }
  
  P.pos.x = Math.max(-48, Math.min(48, P.pos.x));
  P.pos.z = Math.max(-48, Math.min(48, P.pos.z));
  
  if (keys.Space && P.ground) { P.vy = 8; P.ground = false; }
  
  P.vy -= 22 * dt;
  P.pos.y += P.vy * dt;
  
  const g = collide(P.pos, 0.4, P.pos.y);
  if (P.pos.y <= g) {
    P.pos.y = g;
    P.vy = 0;
    P.ground = true;
  } else {
    P.ground = false;
  }
  
  P.cd = Math.max(0, P.cd - dt);
  P.boost = Math.max(0, P.boost - dt);
  
  // 射撃処理
  P.fireT -= dt;
  P.kick = Math.max(0, P.kick - dt * 0.4);
  if (P.reload > 0) {
    P.reload -= dt;
    if (P.reload <= 0) { P.reload = 0; P.ammo = 30; }
  }
  if (fire && P.fireT <= 0 && !P.reload) {
    if (P.ammo > 0) shoot();
    else reload();
  }
  
  // 敵AI処理
  const eye = new THREE.Vector3(P.pos.x, P.pos.y + P.eye - 0.1, P.pos.z);
  for (const e of enemies) {
    const p = e.g.position;
    const dx = P.pos.x - p.x;
    const dz = P.pos.z - p.z;
    const d = Math.hypot(dx, dz) || 1;
    const spd = Math.min(5, 3 + P.wave * 0.2);
    
    let vx = 0, vz = 0;
    if (d > 14) { vx = dx / d; vz = dz / d; }
    else if (d < 7) { vx = -dx / d; vz = -dz / d; }
    
    vx += -dz / d * 0.6 * e.side;
    vz += dx / d * 0.6 * e.side;
    
    p.x += vx * spd * dt;
    p.z += vz * spd * dt;
    p.x = Math.max(-48, Math.min(48, p.x));
    p.z = Math.max(-48, Math.min(48, p.z));
    p.y = collide(p, 0.45, p.y);
    
    e.g.rotation.y = Math.atan2(dx, dz);
    e.cd -= dt;
    
    if (e.cd <= 0 && d < 45) {
      e.cd = 1.1 + Math.random() * 0.8;
      const o = new THREE.Vector3(p.x, p.y + 1.5, p.z);
      const v = eye.clone().sub(o);
      const dist = v.length();
      
      rc.set(o, v.normalize());
      rc.far = dist;
      
      if (rc.intersectObjects(boxes.map(b => b.m), false).length === 0) {
        const hit = Math.random() < Math.max(0.15, Math.min(0.7, 0.8 - dist / 60)) * (P.slide > 0 ? 0.5 : 1);
        tracer(o, hit ? eye : eye.clone().add(new THREE.Vector3((Math.random() - 0.5) * 3, (Math.random() - 0.5) * 2, (Math.random() - 0.5) * 3)), 0xff5a4a);
        if (hit) dmgPlayer(Math.min(10, 5 + P.wave * 0.5));
      }
    }
  }
  
  if (!enemies.length && !G.over) {
    waveWait += dt;
    if (waveWait > 2.5) {
      waveWait = 0;
      nextWave();
    }
  }
  
  // カメラと武器の反映
  P.eye += ((P.slide > 0 ? 0.8 : crouch ? 1.1 : 1.7) - P.eye) * Math.min(1, dt * 14);
  cam.position.set(P.pos.x, P.pos.y + P.eye, P.pos.z);
  cam.rotation.set(P.pitch, P.yaw, 0);
  
  P.adsT += ((adsHeld ? 1 : 0) - P.adsT) * Math.min(1, dt * 12);
  cam.fov = 75 - 30 * P.adsT;
  cam.updateProjectionMatrix();
  
  const L = (a, b) => a + (b - a) * P.adsT;
  const bob = Math.sin(performance.now() / 90) * 0.004 * ((mx || mz) ? 1 : 0) * (1 - P.adsT);
  
  gun.position.set(L(0.22, 0), L(-0.2, -0.0945) + bob, L(-0.5, -0.34) + P.kick * 1.5);
  gun.rotation.x = P.kick * 2;
  
  if (P.flashT > 0) {
    P.flashT -= dt;
    if (P.flashT <= 0) flash.visible = false;
  }
  
  $('dot').style.opacity = P.adsT > 0.85 ? 1 : 0;
  $('scope').style.opacity = P.adsT;
  $('cross').style.visibility = P.adsT > 0.05 ? 'hidden' : 'visible';
  
  // UI更新
  $('hp').firstChild.style.width = Math.max(0, P.hp) + '%';
  $('sh').firstChild.style.width = P.sh * 2 + '\%';$('am').textContent = P.ammo;
  $('reload').textContent = P.reload ? 'リロード中…' : '30発マガジン';
  $('wave').textContent = `ウェーブ ${P.wave}`;
  $('kills').textContent = `キル ${P.kills}`;
  $('abil').textContent = `${LEG[G.legend].n}  Q: ${P.cd > 0 ? Math.ceil(P.cd) + '秒' : '使用可能'}`;
}

let last = performance.now();
function loop(t) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (t - last) / 1000);
  last = t;
  
  if (G.running && locked) update(dt);
  
  for (const x of tracers) x.t -= dt;
  tracers = tracers.filter(x => {
    if (x.t <= 0) {
      scene.remove(x.l);
      x.l.geometry.dispose();
      return false;
    }
    return true;
  });
  
  ren.render(scene, cam);
}

cam.position.set(0, 30, 60);
cam.lookAt(0, 0, 0);
requestAnimationFrame(loop);
</script>
